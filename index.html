/* =========================================================
   开发者工作台 · 白色科技感（与班主任工作台同一套视觉体系）
   ========================================================= */
:root {
  --bg: #f5f5f4;
  --side: #fbfbfa;
  --panel: #ffffff;
  --ink: #171717;
  --ink2: #5c5c5a;
  --ink3: #9a9a97;
  --line: #ececea;
  --line2: #e2e2df;
  --fill: #f3f3f2;
  --fill2: #ebebea;
  --blue: #2f7ff0;
  --blue-soft: #e8f1fe;
  --red: #e5483b;
  --red-soft: #fdecea;
  --amber: #e89a0c;
  --amber-soft: #fdf3df;
  --green: #1d9a57;
  --green-soft: #e6f5ec;
  --tag-bg: #f8eee8;
  --tag-ink: #ad5136;
  --r-xl: 20px;
  --r-lg: 16px;
  --r-md: 12px;
  --r-sm: 8px;
  --sh-card: 0 12px 40px rgba(0, 0, 0, .075), 0 2px 6px rgba(0, 0, 0, .04);
  --sh-pop: 0 18px 60px rgba(0, 0, 0, .12), 0 3px 10px rgba(0, 0, 0, .05);
  --font: "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", system-ui, sans-serif;

  --side-w: 216px;
  --rail-w: 300px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }

::selection { background: #d6e6fd; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink3); }
.sub { color: var(--ink2); }
.hide { display: none !important; }
svg { display: block; }

/* ---------- 框架 ---------- */
.app { display: grid; grid-template-columns: var(--side-w) 1fr; position: fixed; inset: 0; }

/* 侧边栏 */

.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }

/* ---------- 页面通用 ---------- */
.page { height: 100%; overflow-y: auto; padding: 26px 34px 40px; }
.page-head { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; min-height: 36px; flex-wrap: wrap; }

/* ---------- 教室页 ---------- */
.studio-page { position: absolute; inset: 0; }

.stage-inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.studio-title { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); font-size: 17px; font-weight: 700; z-index: 5; pointer-events: none; white-space: nowrap; text-shadow: 0 0 6px var(--bg), 0 0 12px var(--bg); }

/* 全屏按钮：固定在窗口最右上角 */
.fs-global { position: fixed; top: 12px; right: 16px; z-index: 55; box-shadow: 0 0 0 1px var(--line2) inset, 0 2px 8px rgba(0, 0, 0, .04); }
.page-head { padding-right: 96px; }
.thread-head { padding-right: 128px !important; }
.app.with-rail .rail { padding-top: 56px; }.scene-svg .wm { font-size: 9.5px; fill: #c4c4c1; letter-spacing: .4px; font-family: var(--num); pointer-events: none; }
.scene-svg .zone-lbl { font-size: 11.5px; fill: #b0b0ad; letter-spacing: 2px; font-weight: 500; pointer-events: none; }
.scene-svg .wall-board[data-sact] { cursor: pointer; }
.scene-svg .wall-board[data-sact]:hover rect:nth-child(2) { stroke: #c9c9c6; }
.dock { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 6; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.dock .seg { background: #fff; box-shadow: var(--sh-card), 0 0 0 1px var(--line); padding: 4px; }
.dock .seg button { height: 32px; padding: 0 16px; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; }
.subbar { background: #fff; border-radius: 14px; box-shadow: var(--sh-card), 0 0 0 1px var(--line); padding: 7px 8px 7px 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; white-space: nowrap; animation: pop .18s ease-out; }
.subbar .sel { height: 30px; width: auto; font-size: 13px; }
.subbar .inp { height: 30px; width: auto; font-size: 13px; }
.subbar .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
.legend-ramp { display: inline-flex; align-items: center; gap: 6px; color: var(--ink3); font-size: 12px; }
.legend-ramp i { display: inline-block; width: 14px; height: 10px; border-radius: 3px; }

/* 场景 SVG 内样式 */
.scene-svg { overflow: visible; user-select: none; }
.scene-svg text { font-family: var(--font); }
.scene-svg .lbl { font-size: 13px; fill: #3b3b3a; font-weight: 500; paint-order: stroke; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.scene-svg .plate { font-size: 11px; fill: #5c5c5a; font-weight: 500; }
.scene-svg .seatno { font-size: 9.5px; fill: #a3a3a0; font-family: var(--num); }
.seat { cursor: pointer; }
.seat .hit { fill: transparent; }
.seat:hover .hit { fill: rgba(47, 127, 240, .05); }
.seat .stu { transition: opacity .3s; }
.seat .stu-in { transition: opacity .35s, transform .35s; }

.seat:hover .face, .seat.turn .face { opacity: 1; }

.seat.empty:hover .add, .seat.empty.show-add .add { opacity: 1; }

.seat.picked .hit { fill: rgba(47, 127, 240, .10); stroke: var(--blue); stroke-width: 2; }
.seat .tint { mix-blend-mode: multiply; pointer-events: none; opacity: .6; }

@keyframes zz { 0%, 100% { transform: translateY(0); opacity: .9; } 50% { transform: translateY(-4px); opacity: .5; } }
.badge .badge-bg { fill: var(--ink); }

.badge.light .badge-bg { fill: #fff; stroke: #dcdcda; }

.hc-head { display: flex; gap: 12px; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--line); }

.hc-name { font-size: 17px; font-weight: 700; line-height: 1.25; }

.empty-studio { position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%); z-index: 7; background: #fff; border-radius: 18px; box-shadow: var(--sh-pop); padding: 18px 22px 18px 18px; display: flex; gap: 14px; align-items: center; animation: pop .25s ease-out; }

/* 随机点名 */
.pick-card { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); z-index: 8; background: #fff; border-radius: 18px; box-shadow: var(--sh-pop); padding: 14px 22px 14px 14px; display: flex; align-items: center; gap: 14px; animation: pop .25s ease-out; }
.pick-card .nm { font-size: 26px; font-weight: 800; letter-spacing: 2px; line-height: 1.1; }
.pick-card .ava { border-radius: 50%; }

/* 右侧栏 */
.rail-sec { padding: 0 0 18px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
.rail-sec:last-child { border-bottom: 0; }
.rail-k { font-size: 12px; color: var(--ink3); margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; }
.rail-k a, .rail-k button { font-size: 12px; color: var(--ink2); }
.rail-k a:hover, .rail-k button:hover { color: var(--ink); }
.rail-big { font-size: 22px; font-weight: 700; font-family: var(--num); letter-spacing: -.3px; line-height: 1.2; }
.rail-big small { font-size: 13px; font-weight: 500; color: var(--ink3); margin-left: 2px; }
.rail-date { font-size: 17px; font-weight: 700; }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); background: #fff; border-radius: 14px; box-shadow: 0 0 0 1px var(--line); padding: 12px 0; margin-top: 10px; }
.trio > div { text-align: center; position: relative; }
.trio > div + div::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 1px; background: var(--line); }
.trio b { display: block; font-size: 18px; font-family: var(--num); font-weight: 650; line-height: 1.3; }
.trio span { font-size: 11.5px; color: var(--ink3); }
.attbar { display: flex; height: 6px; border-radius: 6px; overflow: hidden; background: var(--fill); margin: 8px 0 6px; gap: 2px; }
.attbar i { display: block; height: 100%; }
.mini-list { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.mini-item { display: flex; align-items: center; gap: 9px; padding: 6px 6px; border-radius: 10px; font-size: 13px; width: 100%; text-align: left; }
.mini-item:hover { background: #ededeb; }
.mini-item .ava { border-radius: 50%; flex: none; }
.mini-item .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-item .r { font-size: 12px; color: var(--ink3); white-space: nowrap; }
.todo { display: flex; align-items: flex-start; gap: 9px; padding: 6px 4px; font-size: 13px; border-radius: 8px; }
.todo:hover { background: #ededeb; }
.todo input { margin-top: 3px; accent-color: var(--ink); width: 15px; height: 15px; flex: none; }
.todo.done span { color: var(--ink3); text-decoration: line-through; }
.todo .x { margin-left: auto; color: var(--ink3); opacity: 0; font-size: 15px; line-height: 1; padding: 2px 4px; }
.todo:hover .x { opacity: 1; }
.todo-add { display: flex; gap: 6px; margin-top: 6px; }
.todo-add .inp { height: 32px; font-size: 13px; background: #ebebea; }
.feed { display: flex; flex-direction: column; gap: 9px; margin-top: 8px; }
.feed-item { display: flex; gap: 8px; font-size: 12.5px; line-height: 1.45; }
.feed-item .d { flex: none; width: 34px; font-family: var(--num); color: var(--ink3); font-size: 11.5px; padding-top: 1px; }
.feed-item .pt { font-family: var(--num); font-weight: 650; }
.feed-item .pt.up { color: var(--green); } .feed-item .pt.dn { color: var(--red); }
.privacy { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--ink3); background: #fff; border-radius: 12px; padding: 10px 12px; box-shadow: 0 0 0 1px var(--line); }
.privacy button { color: var(--ink); font-weight: 500; margin-left: auto; font-size: 12px; }
.rail-toggle { display: none; }

/* ---------- 抽屉 / 弹窗 ---------- */
.mask { position: fixed; inset: 0; background: rgba(20, 20, 20, .22); z-index: 80; animation: fade .18s; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 81; background: #fff; border-radius: 18px; box-shadow: var(--sh-pop); width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 48px); display: flex; flex-direction: column; animation: mpop .2s ease-out; }
.modal.wide { width: min(760px, calc(100vw - 32px)); }
@keyframes mpop { from { opacity: 0; transform: translate(-50%, -48%) scale(.98); } to { opacity: 1; transform: translate(-50%, -50%); } }
.modal-head { padding: 20px 22px 6px; display: flex; align-items: center; }
.modal-title { font-size: 16px; font-weight: 700; }
.modal-x { margin-left: auto; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--ink3); }
.modal-x:hover { background: var(--fill); color: var(--ink); }
.modal-body { padding: 12px 22px 8px; overflow-y: auto; }
.modal-foot { padding: 12px 22px 20px; display: flex; justify-content: flex-end; gap: 8px; }
.drawer { position: fixed; right: 0; top: 0; bottom: 0; width: min(760px, 100vw); background: var(--bg); z-index: 81; box-shadow: var(--sh-pop); display: flex; flex-direction: column; animation: slide .24s cubic-bezier(.2, .8, .2, 1); }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.drawer-body { flex: 1; overflow-y: auto; padding: 0 28px 32px; }
.dr-hero { display: flex; gap: 18px; align-items: center; padding: 24px 28px 18px; position: relative; }
.dr-hero .ava { border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px var(--line); flex: none; }
.dr-name { font-size: 24px; font-weight: 800; line-height: 1.2; display: flex; align-items: center; gap: 10px; }
.dr-meta { font-size: 13px; color: var(--ink2); margin-top: 3px; }
.dr-tools { position: absolute; right: 22px; top: 20px; display: flex; gap: 6px; }
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line2); margin: 0 28px; }
.tabs button { height: 40px; font-size: 14px; color: var(--ink3); position: relative; }
.tabs button.on { color: var(--ink); font-weight: 600; }
.tabs button.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); border-radius: 2px; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 18px 0 14px; }
.kpi { background: #fff; border-radius: 14px; padding: 12px 14px; box-shadow: 0 0 0 1px var(--line); }
.kpi .k { font-size: 12px; color: var(--ink3); }
.kpi .v { font-size: 22px; font-weight: 700; font-family: var(--num); line-height: 1.25; letter-spacing: -.3px; }
.kpi .v small { font-size: 12.5px; color: var(--ink3); font-weight: 500; margin-left: 2px; }
.kpi .d { font-size: 12px; margin-top: 1px; }
.up { color: var(--green); } .dn { color: var(--red); }
.info-grid { display: grid; grid-template-columns: 96px 1fr; gap: 9px 14px; font-size: 13.5px; }
.info-grid .k { color: var(--ink3); }
.timeline { position: relative; padding-left: 18px; }
.timeline::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 1.5px; background: var(--line2); }
.tl-item { position: relative; padding: 0 0 14px; }
.tl-item::before { content: ""; position: absolute; left: -17px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px var(--ink); }
.tl-item.t-表扬::before, .tl-item.t-获奖::before { box-shadow: 0 0 0 2px var(--green); }
.tl-item.t-提醒::before { box-shadow: 0 0 0 2px var(--red); }
.tl-item.t-家访::before { box-shadow: 0 0 0 2px var(--blue); }
.tl-top { font-size: 12px; color: var(--ink3); display: flex; gap: 8px; align-items: center; }
.tl-txt { font-size: 13.5px; margin-top: 2px; }
.tl-item .del { opacity: 0; color: var(--ink3); font-size: 12px; }
.tl-item:hover .del { opacity: 1; }
.cmt { background: #fff; border-radius: 12px; padding: 12px 14px; box-shadow: 0 0 0 1px var(--line); font-size: 13.5px; line-height: 1.7; margin-bottom: 10px; }
.cmt-meta { font-size: 12px; color: var(--ink3); display: flex; gap: 8px; margin-bottom: 4px; align-items: center; }
.cmt-meta .grow { flex: 1; }

/* ---------- 表格 ---------- */
.tbl-wrap { background: #fff; border-radius: 16px; box-shadow: 0 0 0 1px var(--line); overflow: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-weight: 500; color: var(--ink3); font-size: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: #fff; position: sticky; top: 0; z-index: 1; }
.tbl th.sortable { cursor: pointer; }
.tbl th.sortable:hover { color: var(--ink); }
.tbl td { padding: 8px 12px; border-bottom: 1px solid #f2f2f0; white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover td { background: #fafaf9; }
.tbl tr.click { cursor: pointer; }
.tbl .r { text-align: right; }
.tbl .c { text-align: center; }
.tbl .nm { display: flex; align-items: center; gap: 9px; font-weight: 500; }
.tbl .nm .ava { border-radius: 50%; }
.tbl .ops { opacity: 0; } .tbl tr:hover .ops { opacity: 1; }
.filterbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.filterbar .inp { width: 220px; height: 34px; background: #fff; box-shadow: 0 0 0 1px var(--line2) inset; }


/* ---------- 图表 ---------- */
.chart { position: relative; }
.chart svg text { font-family: var(--num); }
.chart .ax { fill: #8b8a85; font-size: 11px; }
.chart .ax-cn { fill: #8b8a85; font-size: 11.5px; font-family: var(--font); }
.chart .lab { fill: var(--ink); font-size: 11.5px; font-weight: 600; }
.chart .grid { stroke: #ecebe6; }
.chart .base { stroke: #cfcec7; }
.chart .hot { cursor: default; }
.chart .hot:hover + .mk, .chart .mk.on { stroke-width: 3; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink2); margin-top: 6px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.legend i.sq { width: 10px; height: 10px; border-radius: 3px; }
.tip { position: fixed; z-index: 90; pointer-events: none; background: #fff; color: var(--ink); border-radius: 10px; box-shadow: var(--sh-pop); padding: 8px 11px; font-size: 12.5px; line-height: 1.55; opacity: 0; transition: opacity .1s; max-width: 260px; }
.tip.on { opacity: 1; }
.tip b { font-weight: 650; }
.tip .tk { color: var(--ink3); }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
.small-mult { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 18px; }
.sm-cell .t { font-size: 12.5px; font-weight: 600; display: flex; justify-content: space-between; }
.sm-cell .t span { font-weight: 400; color: var(--ink3); font-family: var(--num); }
.warn-list { display: flex; flex-direction: column; gap: 6px; }

/* ---------- AI 助手 ---------- */
.ai-page { height: 100%; display: flex; flex-direction: column; }
.ai-home { flex: 1; overflow-y: auto; padding: 48px 34px 40px; }
.ai-wrap { max-width: 860px; margin: 0 auto; }
.ai-hello { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
.ai-hello .ava { border-radius: 50%; }
.ai-hello h1 { font-size: 26px; margin: 0; font-weight: 800; letter-spacing: .3px; }
.ai-hello p { margin: 0; color: var(--ink2); font-size: 13.5px; display: flex; align-items: center; gap: 6px; }
.composer { background: #fff; border-radius: 18px; box-shadow: 0 0 0 1px var(--line), 0 6px 24px rgba(0, 0, 0, .04); padding: 14px 16px 12px; }
.composer textarea { width: 100%; border: 0; outline: none; resize: none; min-height: 72px; max-height: 220px; font-size: 14.5px; line-height: 1.6; background: transparent; }
.composer-bar { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.composer-bar .grow { flex: 1; }
.ctx-chip { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 11px; border-radius: 999px; background: var(--fill); font-size: 12.5px; color: var(--ink2); }
.ctx-chip:hover { color: var(--ink); background: var(--fill2); }
.ctx-chip.on { background: var(--ink); color: #fff; }
.send { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; flex: none; }
.send:hover { background: #333; }
.send[disabled] { background: #cfcfcd; }
.api-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink2); background: #fff; border-radius: 999px; padding: 4px 10px; box-shadow: 0 0 0 1px var(--line2); }
.api-pill i { width: 7px; height: 7px; border-radius: 50%; background: #c9c9c6; }
.api-pill.ok i { background: var(--green); }
.tpl-tabs { display: flex; gap: 18px; margin: 26px 0 12px; font-size: 13px; }
.tpl-tabs button { color: var(--ink3); }
.tpl-tabs button.on { color: var(--ink); font-weight: 600; }
.tpl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.tpl { background: #fff; border-radius: 14px; padding: 14px 16px; text-align: left; box-shadow: 0 0 0 1px var(--line); transition: box-shadow .15s, transform .15s; min-height: 92px; display: flex; flex-direction: column; }
.tpl:hover { box-shadow: 0 0 0 1px var(--line2), 0 8px 24px rgba(0, 0, 0, .06); transform: translateY(-1px); }
.tpl .t { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.tpl .t i { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; font-style: normal; flex: none; }
.tpl .d { font-size: 12.5px; color: var(--ink3); margin-top: 6px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ai-thread { flex: 1; overflow-y: auto; padding: 20px 34px 10px; }
.ai-thread .ai-wrap { max-width: 820px; }
.thread-head { display: flex; align-items: center; gap: 10px; padding: 18px 34px 0; }
.thread-head .t { font-size: 15px; font-weight: 700; flex: 1; text-align: center; }
.msg { margin: 16px 0; display: flex; gap: 10px; }
.msg.user { justify-content: flex-end; }
.msg.user .bubble { background: #fff; box-shadow: 0 0 0 1px var(--line); border-radius: 14px 14px 4px 14px; padding: 10px 14px; max-width: 76%; font-size: 13.5px; white-space: pre-wrap; }
.msg.bot .ava { border-radius: 50%; flex: none; margin-top: 2px; }
.msg.bot .body { flex: 1; min-width: 0; }
.msg.bot .who { font-size: 12px; color: var(--ink3); margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
.md { font-size: 14px; line-height: 1.8; color: #222; background: #fff; border-radius: 4px 14px 14px 14px; padding: 14px 18px; box-shadow: 0 0 0 1px var(--line); overflow-wrap: anywhere; }
.md h1, .md h2, .md h3 { font-size: 15.5px; margin: 14px 0 6px; line-height: 1.5; }
.md h1 { font-size: 17px; }
.md p { margin: 6px 0; }
.md ul, .md ol { margin: 6px 0; padding-left: 22px; }
.md li { margin: 2px 0; }
.md table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
.md td, .md th { border: 1px solid var(--line2); padding: 4px 8px; }
.md blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid var(--line2); color: var(--ink2); }
.md code { background: var(--fill); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
.md .cursor { display: inline-block; width: 7px; height: 15px; background: var(--ink); vertical-align: -2px; animation: blink 1s steps(2) infinite; margin-left: 2px; }
@keyframes blink { 50% { opacity: 0; } }
.msg-tools { display: flex; gap: 4px; margin-top: 6px; }
.msg-err { background: var(--red-soft); color: #a8322a; border-radius: 12px; padding: 10px 14px; font-size: 13px; line-height: 1.6; }
.ai-foot { padding: 10px 34px 18px; }
.ai-foot .composer textarea { min-height: 44px; }
.ai-note { text-align: center; font-size: 11.5px; color: var(--ink3); margin-top: 8px; }
.batch-item { background: #fff; border-radius: 12px; padding: 12px 14px; box-shadow: 0 0 0 1px var(--line); margin-bottom: 8px; }
.batch-item .h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.batch-item .h .grow { flex: 1; }
.batch-item .tx { font-size: 13.5px; line-height: 1.75; white-space: pre-wrap; }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; max-height: 240px; overflow-y: auto; padding: 2px; }
.pick-grid label { display: flex; align-items: center; gap: 6px; font-size: 13px; background: var(--fill); border-radius: 8px; padding: 6px 8px; cursor: pointer; }
.pick-grid input { accent-color: var(--ink); margin: 0; }
.prompt-box { background: var(--fill); border-radius: 12px; padding: 12px 14px; font-size: 12.5px; line-height: 1.65; white-space: pre-wrap; max-height: 300px; overflow: auto; color: var(--ink2); font-family: var(--font); }

/* ---------- 设置 ---------- */
.set-layout { display: grid; grid-template-columns: 180px 1fr; gap: 24px; align-items: start; max-width: 1060px; }
.set-nav { position: sticky; top: 0; display: flex; flex-direction: column; gap: 2px; }
.set-nav button { text-align: left; height: 34px; padding: 0 12px; border-radius: 9px; font-size: 13.5px; color: var(--ink2); }
.set-nav button:hover { background: var(--fill); color: var(--ink); }
.set-nav button.on { background: #ececea; color: var(--ink); font-weight: 600; }
.set-sec { margin-bottom: 16px; }
.gender-pick { display: flex; gap: 14px; }
.gender-pick button { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 16px 10px; border-radius: 16px; font-size: 13px; color: var(--ink2); box-shadow: 0 0 0 1px var(--line); background: #fff; }
.gender-pick button .ava { border-radius: 50%; }
.gender-pick button.on { box-shadow: 0 0 0 2px var(--ink); color: var(--ink); font-weight: 600; }
.sub-list { display: flex; flex-wrap: wrap; gap: 8px; }
.sub-item { display: inline-flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 10px; padding: 4px 6px 4px 10px; font-size: 13px; }
.sub-item input { width: 52px; height: 26px; border: 0; border-radius: 6px; background: #fff; text-align: center; font-family: var(--num); font-size: 12.5px; outline: none; }
.sub-item button { color: var(--ink3); width: 20px; height: 20px; border-radius: 6px; }
.sub-item button:hover { background: #fff; color: var(--red); }
.mini-class { display: inline-grid; gap: 3px; padding: 10px; background: var(--fill); border-radius: 12px; }
.mini-class i { display: block; width: 14px; height: 10px; background: #fff; border-radius: 2px; box-shadow: 0 0 0 1px var(--line2); }

/* ---------- 引导 ---------- */
.welcome { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; place-items: center; animation: fade .3s; overflow-y: auto; padding: 24px; }
.welcome-in { text-align: center; max-width: 620px; width: 100%; }
.welcome h1 { font-size: 22px; margin: 0 0 4px; font-weight: 700; }
.welcome p.lead { color: var(--ink2); margin: 0 0 30px; font-size: 15px; }
.w-avatars { display: flex; justify-content: center; gap: 28px; margin-bottom: 26px; }
.w-avatars button { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 13px; color: var(--ink3); }
.w-avatars button .circle { width: 108px; height: 108px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 10px 30px rgba(0, 0, 0, .06); transition: transform .2s, box-shadow .2s; }
.w-avatars button:hover .circle { transform: translateY(-3px); }
.w-avatars button.on .circle { box-shadow: 0 0 0 2.5px var(--ink), 0 10px 30px rgba(0, 0, 0, .08); }
.w-avatars button.on { color: var(--ink); font-weight: 600; }
.w-form { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; text-align: left; max-width: 440px; margin: 0 auto; }
.w-mode { display: flex; gap: 10px; justify-content: center; margin: 4px 0 28px; }
.w-mode button { padding: 10px 16px; border-radius: 12px; background: #fff; box-shadow: 0 0 0 1px var(--line); font-size: 13px; color: var(--ink2); text-align: left; width: 212px; }
.w-mode button b { display: block; color: var(--ink); font-size: 14px; margin-bottom: 2px; }
.w-mode button.on { box-shadow: 0 0 0 2px var(--ink); }
.w-go { height: 44px; padding: 0 44px; font-size: 15px; }

/* toast */
.toast { position: fixed; left: 50%; bottom: 140px; transform: translateX(-50%); z-index: 120; background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 999px; font-size: 13px; box-shadow: var(--sh-pop); animation: pop .2s; white-space: nowrap; }

/* 演示数据横幅 */
.demo-bar { position: absolute; left: 16px; top: 14px; z-index: 6; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink2); background: #fff; border-radius: 999px; padding: 4px 4px 4px 12px; box-shadow: 0 0 0 1px var(--line2); }

/* ---------- 响应式（PC 为主） ---------- */
@media (max-width: 1440px) {
  :root { --rail-w: 272px; --side-w: 200px; }
  .page { padding: 22px 24px 36px; }
}
@media (max-width: 1280px) {
  .app.with-rail { grid-template-columns: var(--side-w) 1fr; }
  .app.with-rail .rail { position: fixed; right: 0; top: 0; bottom: 0; width: 300px; background: var(--bg); z-index: 50; box-shadow: var(--sh-pop); padding-left: 22px; transform: translateX(100%); transition: transform .25s; }
  .app.rail-open .rail { transform: none; }
  .rail-toggle { display: inline-flex; }
  .top-tools { right: 112px; }
  .app.with-rail .rail { padding-top: 60px; }
  .tpl-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 1080px) {
  :root { --side-w: 64px; }
  .brand-name, .brand-sub, .nav a span.t, .nav-label, .recent, .me-name, .me-sub, .me .gear, .sign, .search, .nav .cnt { display: none; }
  .nav a { justify-content: center; padding: 0; }
  .brand { justify-content: center; padding-left: 0; padding-right: 0; }
  .score-layout { grid-template-columns: 1fr; }
  .grid2 { grid-template-columns: 1fr; }
  .set-layout { grid-template-columns: 1fr; }
  .set-nav { position: static; flex-direction: row; flex-wrap: wrap; }
}

}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
@media print {
  body { overflow: visible; }
}


/* ---------- 开发者工作台 · 专属组件 ---------- */
.mono { font-family: "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace; }
.tag.violet { background: #efebfe; color: #5b3fd6; }
.tag.cyan { background: #e3f6f9; color: #0b7f93; }
.tag.dark { background: var(--ink); color: #fff; }
.pico { display: inline-grid; place-items: center; flex: none; border-radius: 10px; color: #fff; font-weight: 700; font-size: 14px; }
.pdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.pdot.live { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.pdot.dev { background: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.pdot.test { background: #7a5af5; box-shadow: 0 0 0 3px #efebfe; }
.pdot.idea { background: #14b0a6; box-shadow: 0 0 0 3px #e3f6f4; }
.pdot.paused { background: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
.pdot.archived { background: #c2c2bf; box-shadow: 0 0 0 3px var(--fill); }

/* 机房场景 */
.scene-svg .led-on { animation: led 2.4s ease-in-out infinite; }
@keyframes led { 50% { opacity: .35; } }
.scene-svg .hdd { animation: flick 1.2s steps(2, jump-none) infinite; }
@keyframes flick { 0% { opacity: 1; } 100% { opacity: .2; } }
.seat.busy .hdd { animation-duration: .16s !important; }
.seat.busy .rk-lcd { filter: brightness(1.3); }
.scene-svg.calm .hdd, .scene-svg.calm .led-on, .scene-svg.calm .rk-alarm { animation: none; }
.scene-svg .rk-alarm { animation: alarm 1.4s ease-in-out infinite; }
@keyframes alarm { 50% { opacity: .02; } }
.seat .rk { transition: transform .25s cubic-bezier(.3, 1.4, .6, 1); }
.seat.has:hover .rk { transform: translateY(-3px); }
.seat.ghost .rk { opacity: .4; }
.seat.ghost:hover .rk { opacity: .7; }
.seat.dim .rk, .seat.dim .plabel { opacity: .35; }
.enter .seat .rk { animation: enter .5s both; }
.seat.empty .add { opacity: 0; transition: opacity .15s; }
.seat.empty:hover .add { opacity: 1; }
.scene-svg .console { cursor: pointer; }
.scene-svg .console .con-mons { transition: transform .25s; }
.scene-svg .console:hover .con-mons { transform: translateY(-2px); }
.scene-svg .plabel { font-size: 13.5px; fill: #2a2a29; font-weight: 650; paint-order: stroke; stroke: #f3f3f1; stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }

/* 入口按钮（悬浮卡、弹层、抽屉、搜索通用） */
.lk-row { display: flex; flex-wrap: wrap; gap: 6px; }
.lkb { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 999px; background: var(--fill); font-size: 12.5px; color: var(--ink2); transition: background .15s, color .15s; }
.lkb:hover { background: var(--ink); color: #fff; }
.lkb svg { width: 14px; height: 14px; }
.lkb.add { background: transparent; box-shadow: 0 0 0 1px var(--line2) inset; color: var(--ink3); }
.lkb.add:hover { background: var(--fill); color: var(--ink); }
.qlinks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ql { display: flex; gap: 10px; align-items: center; background: #fff; border-radius: 12px; padding: 11px 12px; box-shadow: 0 0 0 1px var(--line); text-align: left; min-width: 0; transition: box-shadow .15s; }
.ql:hover { box-shadow: 0 0 0 1.5px var(--ink); }
.ql .i { width: 32px; height: 32px; border-radius: 9px; background: var(--fill); display: grid; place-items: center; flex: none; }
.ql .t { font-size: 13px; font-weight: 600; }
.ql small { display: block; font-size: 11.5px; color: var(--ink3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ql .grow { flex: 1; min-width: 0; }
.ql.off { background: transparent; box-shadow: 0 0 0 1px var(--line2) inset; }
.ql.off .t { color: var(--ink3); font-weight: 500; }
.ql .cp { opacity: 0; color: var(--ink3); width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; }
.ql:hover .cp { opacity: 1; }
.ql .cp:hover { background: var(--fill); color: var(--ink); }
.env { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; background: #171717; color: #dbe9fd; border-radius: 6px; padding: 3px 8px; display: inline-block; }

/* 侧栏搜索：项目 + 入口 */
.sp-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; font-size: 13px; }
.sp-row:hover, .sp-row.on { background: var(--fill); }
.sp-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
.sp-links { display: flex; gap: 1px; flex: none; }
.sp-links button { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: var(--ink3); }
.sp-links button:hover { background: var(--ink); color: #fff; }
.sp-links svg { width: 13px; height: 13px; }
.search .kbd { position: absolute; right: 8px; top: 8px; pointer-events: none; }
.search input:focus + .kbd, .search input:not(:placeholder-shown) + .kbd { display: none; }

/* 看板 */
.kb { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
.kb-col { background: #efefed; border-radius: 16px; padding: 10px; min-height: 440px; transition: box-shadow .15s, background .15s; }
.kb-col.drop-on { box-shadow: 0 0 0 1.5px var(--blue) inset; background: var(--blue-soft); }
.kb-h { display: flex; align-items: center; gap: 8px; padding: 4px 6px 10px; font-size: 13.5px; font-weight: 600; }
.kb-h .muted { font-weight: 400; font-size: 12px; }
.kb-card { background: #fff; border-radius: 12px; padding: 10px 12px; box-shadow: 0 0 0 1px var(--line); margin-bottom: 8px; cursor: grab; transition: box-shadow .15s; }
.kb-card:hover { box-shadow: 0 0 0 1px var(--line2), 0 6px 18px rgba(0, 0, 0, .05); }
.kb-card.dragging { opacity: .4; }
.kb-card .t { font-size: 13.5px; line-height: 1.5; margin: 6px 0 8px; }
.kb-card.done .t { color: var(--ink3); text-decoration: line-through; }
.kb-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink3); flex-wrap: wrap; }
.kb-top { display: flex; align-items: center; gap: 6px; }
.kb-top .x { margin-left: auto; }
.pri { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.tick { width: 18px; height: 18px; border-radius: 50%; box-shadow: 0 0 0 1.5px #cfcfcc inset; display: grid; place-items: center; color: transparent; flex: none; }
.tick:hover { box-shadow: 0 0 0 1.5px var(--ink) inset; color: var(--ink3); }
.tick.on { background: var(--ink); color: #fff; box-shadow: none; }
.tick svg { width: 12px; height: 12px; }
.quick { display: flex; gap: 8px; align-items: center; background: #fff; border-radius: 14px; box-shadow: 0 0 0 1px var(--line); padding: 8px 8px 8px 14px; margin-bottom: 14px; flex-wrap: wrap; }
.quick .inp { background: transparent; height: 34px; padding: 0; flex: 1; min-width: 220px; }
.quick .inp:focus { box-shadow: none; background: transparent; }
.quick .sel { width: auto; height: 32px; font-size: 12.5px; }
.quick input[type=date].inp { flex: none; width: 140px; background: var(--fill); padding: 0 10px; min-width: 0; }

/* 灵感池 */
.idea-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.idea { background: #fff; border-radius: 16px; box-shadow: 0 0 0 1px var(--line); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.idea-top { display: flex; gap: 12px; align-items: center; }
.score { width: 56px; height: 56px; border-radius: 50%; flex: none; display: grid; place-items: center; position: relative; background: conic-gradient(var(--sc, #171717) calc(var(--p) * 1%), var(--fill) 0); }
.score::before { content: ""; position: absolute; inset: 5px; background: #fff; border-radius: 50%; }
.score b { position: relative; font-family: var(--num); font-size: 18px; font-weight: 700; }
.idea h3 { margin: 0; font-size: 15px; }
.idea p { margin: 0; font-size: 13px; color: var(--ink2); line-height: 1.65; }
.dims { display: grid; gap: 6px; }
.dim { display: grid; grid-template-columns: 62px 1fr 14px; gap: 8px; align-items: center; font-size: 12px; color: var(--ink3); }
.dots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.dots i { height: 6px; border-radius: 3px; background: var(--fill2); }
.dots i.on { background: var(--ink); }
.dots.rev i.on { background: var(--amber); }
.idea-foot { display: flex; gap: 6px; margin-top: auto; padding-top: 4px; flex-wrap: wrap; }
.range-row { display: grid; grid-template-columns: 92px 1fr 28px; gap: 10px; align-items: center; font-size: 13px; margin-bottom: 10px; }
.range-row input { accent-color: var(--ink); width: 100%; }
.range-row b { font-family: var(--num); text-align: right; }

/* 收支 */
.money-dn { color: var(--red); }
.bar-cell { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.bar-cell .prog { flex: 1; margin: 0; height: 6px; }
.days { font-family: var(--num); font-size: 12px; }
.sum-line { display: flex; gap: 18px; font-size: 13px; color: var(--ink2); margin: 10px 2px 0; flex-wrap: wrap; }
.sum-line b { font-family: var(--num); color: var(--ink); }
.hc-links { margin-top: 12px; }
.hc-links .lk-row { gap: 5px; }
.hc-links .lkb { height: 26px; padding: 0 9px; font-size: 12px; }
.ms-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.ms-row:last-child { border-bottom: 0; }
.ms-row .grow { flex: 1; min-width: 0; }
.ms-row .del { opacity: 0; color: var(--ink3); }
.ms-row:hover .del { opacity: 1; }
.ms-row.done .grow { color: var(--ink3); text-decoration: line-through; }
.notes-ta { min-height: 260px; font-family: "SF Mono", Menlo, Consolas, "PingFang SC", monospace; font-size: 13px; }
.color-pick { display: flex; gap: 8px; flex-wrap: wrap; }
.color-pick button { width: 26px; height: 26px; border-radius: 50%; box-shadow: 0 0 0 2px #fff inset; }
.color-pick button.on { box-shadow: 0 0 0 2px #fff inset, 0 0 0 2px var(--ink); }
.lgrid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.lgrid2 .field > label { display: flex; align-items: center; gap: 6px; font-weight: 500; }
@media (max-width: 1280px) { .idea-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 1080px) { .kb { grid-template-columns: 1fr; } .qlinks { grid-template-columns: 1fr; } }
.prog { height: 4px; background: var(--fill); border-radius: 4px; margin-top: 8px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--ink); border-radius: 4px; }
.search-pop .sp-row { padding: 4px 6px 4px 8px; }
.search-pop .sp-row > button { width: auto; flex: 1; min-width: 0; padding: 2px 0; background: none; }
.search-pop .sp-row > button:hover { background: none; }
.search-pop .sp-links button { width: 26px; height: 26px; padding: 0; display: grid; place-items: center; border-radius: 7px; flex: none; }
.search-pop .sp-links button:hover { background: var(--ink); color: #fff; }
.search-pop .sp-links button svg { width: 14px; height: 14px; }
.search .search-pop svg { position: static; }
.recent button { padding: 0 10px; width: 100%; text-align: left; border-radius: 8px; }
.recent button:hover { background: #f1f1ef; color: var(--ink); }
.privacy span { flex: 1; min-width: 0; }
.privacy button { white-space: nowrap; flex: none; }

/* ---------- 设备形态 / 快捷跳转 ---------- */
.ptag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px 0 6px; border-radius: 6px; font-size: 12px; white-space: nowrap; vertical-align: middle; background: var(--fill); color: var(--ink2); }
.ptag svg { width: 13px; height: 13px; }
.ptag.multi { background: #eceef1; color: #2b3037; }
.ptag.pc { background: var(--blue-soft); color: #1f63c7; }
.ptag.mobile { background: #efebfe; color: #5b3fd6; }
.q3 { display: inline-flex; gap: 4px; flex: none; }
.q3b { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 9px 0 7px; border-radius: 8px; background: #fff; box-shadow: 0 0 0 1px var(--line2) inset; font-size: 12px; color: var(--ink); white-space: nowrap; transition: background .15s, color .15s; }
.q3b svg { width: 14px; height: 14px; }
.q3b:hover { background: var(--ink); color: #fff; box-shadow: none; }
.q3b.off { color: var(--ink3); background: transparent; box-shadow: 0 0 0 1px var(--line2) inset; border: 0; background-image: none; }
.q3b.off:hover { background: var(--fill); color: var(--ink); }
.q3b.off svg { opacity: .55; }
.q3.icon .q3b { width: 28px; height: 26px; padding: 0; justify-content: center; }
.q3.icon .q3b span { display: none; }
.hc-links .q3 { margin-bottom: 8px; }
.dr-q3 { margin-top: 10px; }
.dr-q3 .q3b { height: 30px; padding: 0 12px 0 9px; font-size: 13px; }
.jump-list { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.jump-row { display: flex; align-items: center; gap: 6px; padding: 3px 2px 3px 4px; border-radius: 10px; }
.jump-row:hover { background: #ededeb; }
.jump-nm { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; font-size: 13px; text-align: left; }
.jump-nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jump-nm .pf-i { color: var(--ink3); display: inline-grid; flex: none; font-style: normal; }
.jump-nm .pf-i svg { width: 12px; height: 12px; }
.pf-chip { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 999px; background: var(--fill); font-size: 12.5px; color: var(--ink2); }
.pf-chip svg { width: 14px; height: 14px; }
.pf-chip em { font-style: normal; color: var(--ink3); font-size: 11.5px; }
.pf-chip b { font-weight: 650; color: var(--ink); }
.pf-chip:hover { background: var(--fill2); }
.pf-chip.on { background: var(--ink); color: #fff; }
.pf-chip.on em, .pf-chip.on b { color: #fff; }
.dl-legend { display: inline-flex; align-items: center; gap: 3px; }
.dl-legend svg { width: 13px; height: 13px; margin-left: 4px; }
.chips button svg { width: 13px; height: 13px; vertical-align: -2px; margin-right: 3px; }
.plat-pick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.plat-pick button { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #fff; box-shadow: 0 0 0 1px var(--line2) inset; text-align: left; min-width: 0; }
.plat-pick button:hover { box-shadow: 0 0 0 1px #cfcfcc inset; }
.plat-pick button.on { box-shadow: 0 0 0 2px var(--ink) inset; }
.plat-pick .pp-ic { width: 34px; height: 34px; border-radius: 10px; background: var(--fill); display: grid; place-items: center; flex: none; }
.plat-pick button.on .pp-ic { background: var(--ink); color: #fff; }
.plat-pick .pp-ic svg { width: 18px; height: 18px; }
.plat-pick b { display: block; font-size: 13px; }
.plat-pick small { display: block; font-size: 11.5px; color: var(--ink3); line-height: 1.4; margin-top: 1px; }
.q3-fields .field > label { display: flex; align-items: center; gap: 6px; }
.q3-fields .inp { background: var(--blue-soft); }

/* 机房里的跳转按钮（SVG） */
.scene-svg .dlink { cursor: pointer; }
.scene-svg .dlink .dl-bg { fill: #ffffff; stroke: #d9dde2; stroke-width: 1; transition: fill .15s; }
.scene-svg .dlink .ic { stroke: #3b3b3a; }
.scene-svg .dlink:hover .dl-bg { fill: #171717; stroke: #171717; }
.scene-svg .dlink:hover .ic { stroke: #ffffff; }
.scene-svg .dlink.off .dl-bg { fill: transparent; stroke: #c9cdd2; stroke-dasharray: 3 3; }
.scene-svg .dlink.off .ic { stroke: #b5b9bf; }
.scene-svg .dlink.off:hover .dl-bg { fill: #ffffff; stroke: #9aa1a9; }
.scene-svg .dlink.off:hover .ic { stroke: #5c5c5a; }
.seat.dim .dlinks, .seat.ghost .dlinks { opacity: .55; }

/* ---------- 左侧栏：资料证书 ---------- */
.vs { flex: 1 1 auto; min-height: 120px; display: flex; flex-direction: column; margin: 12px 2px 0; background: #fff; border-radius: 14px; box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.vs-head { display: flex; align-items: center; gap: 6px; padding: 10px 8px 6px 12px; }
.vs-title { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 650; flex: 1; text-align: left; }
.vs-title em { font-style: normal; font-weight: 400; font-size: 11.5px; color: var(--ink3); }
.vs-title:hover { color: var(--blue); }
.vs-add { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: var(--ink2); }
.vs-add:hover { background: var(--ink); color: #fff; }
.vs-add svg { width: 14px; height: 14px; }
.vs-alert { display: flex; align-items: center; gap: 6px; margin: 0 8px 6px; padding: 6px 9px; border-radius: 9px; background: var(--red-soft); color: #c23a2e; font-size: 12px; text-align: left; }
.vs-alert svg { width: 13px; height: 13px; flex: none; }
.vs-list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 6px 6px; }
.vs-list::-webkit-scrollbar { width: 6px; }
.vs-list::-webkit-scrollbar-thumb { background: #dcdcda; border-radius: 6px; }
.vs-ch { display: flex; align-items: center; gap: 7px; width: 100%; height: 28px; padding: 0 6px; border-radius: 8px; font-size: 12.5px; color: var(--ink2); text-align: left; }
.vs-ch:hover { background: var(--fill); color: var(--ink); }
.vs-ch i { width: 7px; height: 7px; border-radius: 2px; flex: none; }
.vs-ch span { flex: 1; }
.vs-ch em { font-style: normal; font-size: 11.5px; color: var(--ink3); }
.vs-ch .chev { color: var(--ink3); transform: rotate(90deg); transition: transform .15s; flex: none; }
.vs-cat.closed .chev { transform: none; }
.vs-items { display: flex; flex-direction: column; padding: 0 0 4px 8px; }
.vs-it { display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 6px; border-radius: 8px; font-size: 12.5px; text-align: left; min-width: 0; }
.vs-it:hover { background: var(--fill); }
.vs-fc { width: 18px; height: 18px; border-radius: 5px; background: var(--fill); color: var(--ink3); font-size: 10px; font-weight: 700; display: grid; place-items: center; flex: none; font-family: var(--num); }
.vs-fc.on { background: #e9eef6; color: #1f63c7; }
.vs-fc svg { width: 11px; height: 11px; }
.vs-nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vs-due-t { font-size: 10.5px; padding: 1px 5px; border-radius: 5px; background: var(--fill); color: var(--ink2); flex: none; font-family: var(--num); }
.vs-due-t.red { background: var(--red-soft); color: #c23a2e; }
.vs-due-t.amber { background: var(--amber-soft); color: #a86c00; }
.vs-drop { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 0 8px 8px; height: 34px; border-radius: 9px; border: 1.5px dashed #d6d6d3; color: var(--ink3); font-size: 12px; cursor: pointer; transition: all .15s; flex: none; }
.vs-drop:hover { border-color: var(--ink2); color: var(--ink); }
.vs-drop svg { width: 14px; height: 14px; }

.vault-drop { display: flex; align-items: center; gap: 14px; padding: 16px 18px; margin-bottom: 14px; border-radius: 14px; border: 1.5px dashed #d0d0cd; background: #fff; color: var(--ink2); cursor: pointer; transition: all .15s; }

<script>

/* =========================================================

   每个项目一台设备：多端 = 服务器机柜，PC 端 = 电脑，手机端 = 手机；不放人物
   ========================================================= */
var ART = (function () {
  var INK = '#171717';
  var GROUPS = [
    { name: '第一组', color: '#e5483b' },
    { name: '第二组', color: '#2f7ff0' },
    { name: '第三组', color: '#f2b01e' },
    { name: '第四组', color: '#14b0a6' },
    { name: '第五组', color: '#7a5af5' },
    { name: '第六组', color: '#3ea35c' }
  ];

  function r1(v) { return Math.round(v * 10) / 10; }
  function at(o) {
    var s = '';
    for (var k in o) {
      if (o[k] === undefined || o[k] === null || o[k] === false) continue;
      s += ' ' + k + '="' + o[k] + '"';
    }
    return s;
  }
  function T(name, o, inner) {
    return '<' + name + at(o) + (inner === undefined ? '/>' : '>' + inner + '</' + name + '>');
  }
  function rect(x, y, w, h, rx, fill, extra) {
    var o = { x: r1(x), y: r1(y), width: r1(w), height: r1(h) };
    if (rx) o.rx = rx;
    if (fill) o.fill = fill;
    if (extra) for (var k in extra) o[k] = extra[k];
    return T('rect', o);
  }
  function circ(cx, cy, r, fill, extra) {
    var o = { cx: r1(cx), cy: r1(cy), r: r }; if (fill) o.fill = fill;
    if (extra) for (var k in extra) o[k] = extra[k];
    return T('circle', o);
  }
  function ell(cx, cy, rx, ry, fill, extra) {
    var o = { cx: r1(cx), cy: r1(cy), rx: rx, ry: ry }; if (fill) o.fill = fill;
    if (extra) for (var k in extra) o[k] = extra[k];
    return T('ellipse', o);
  }
  function path(d, fill, extra) {
    var o = { d: d }; if (fill) o.fill = fill;
    if (extra) for (var k in extra) o[k] = extra[k];
    return T('path', o);
  }
  function poly(pts, fill, extra) {
    var o = { points: pts.map(function (p) { return r1(p[0]) + ',' + r1(p[1]); }).join(' ') };

    if (extra) for (var k in extra) o[k] = extra[k];

  }
  function txt(x, y, s, extra) {

  function escx(s) {

    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }

      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;

  }
  function groupColor(i) { return GROUPS[((i % GROUPS.length) + GROUPS.length) % GROUPS.length].color; }
  /* ---------- 公共 defs ---------- */
  function defs() {
    return '<defs>' +

      '<linearGradient id="gDeskFace" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9e9e8"/><stop offset="1" stop-color="#dededc"/></linearGradient>' +

      '<linearGradient id="gLectFace" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f4f3"/><stop offset="1" stop-color="#e7e7e5"/></linearGradient>' +

  /* ---------- 角色：学生（背面坐姿，原点=头部中心） ---------- */
  function studentFigure(st, color) {

  /* ---------- 角色：头像（正面，用于卡片） ---------- */
  function avatar(st, size, opts) {
    opts = opts || {};

  /* ---------- 角色：老师（正面站立，原点=头部中心） ---------- */

    if (f) {

  function teacherAvatar(t, size, bg) {

  /* ---------- 墙面小物件（沿用：时钟） ---------- */
    function paper(px, py) {

        rect(px + 7, py + 37, 22, 1.6, .8, '#d5d5d3') + rect(px + 7, py + 43, 28, 1.6, .8, '#d5d5d3') + circ(px + 22, py + 2, 2.2, '#2f7ff0') + '</g>';

document.addEventListener('mousemove', function (e) {
  var tip = $('#tip'); if (!tip) return;
  var el = e.target.closest && e.target.closest('[data-tip]');
  if (!el) { tip.classList.remove('on'); return; }
  tip.innerHTML = el.getAttribute('data-tip');

    if (!req) { UI.toast('当前浏览器不支持网页全屏，可以按 F11'); return; }
    var p = req.call(el);
    if (p && p.catch) p.catch(function () { UI.toast('浏览器没有允许全屏，可以按 F11'); });

  a.href = URL.createObjectURL(blob); a.download = name;

}

  }

}

/* ---------- 实时检测：浏览器 no-cors 直接请求，能连上算正常，超过 1.5 秒算变慢 ---------- */
UI.act['ops-check'] = function (btn) {
  var list = monitorList();
  if (!list.length) { UI.toast('还没有可以检测的地址，先给项目填上前端或后端地址'); return; }
  UI.toast('正在检测 ' + list.length + ' 个地址…');
  if (btn) btn.disabled = true;
  var done = 0;
  list.forEach(function (it) {
    var t0 = performance.now(), ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 8000);
    var url = /^https?:\/\//i.test(it.url) ? it.url : 'https://' + it.url;
    fetch(url, { mode: 'no-cors', cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
      .then(function () { var ms = Math.round(performance.now() - t0); upd(it.key, ms > 1500 ? 'warn' : 'ok', ms); })
      .catch(function () { upd(it.key, 'down', null); })
      .then(function () {
        clearTimeout(timer); done++;
        if (done === list.length) {
          save(); if (btn) btn.disabled = false;
          var bad = monitorList().filter(function (x) { return x.m.status !== 'ok'; }).length;
          UI.toast(bad ? '检测完成：' + bad + ' 个地址异常' : '检测完成：全部正常');
          if (UI.page === 'studio') { drawScene(); renderDock(); Std.renderRail(); }
          if (UI.drawerPid) renderProjDrawer();
        }
      });
  });
  function upd(k, st, ms) {
    var m = S.monitors[k] || { hist: [] };
    m.status = st; m.latency = ms; m.checked = Date.now();
    if (!Array.isArray(m.hist)) m.hist = [];
    var v = st === 'ok' ? 100 : st === 'warn' ? 99.5 : 96;
    if (m.day === todayStr() && m.hist.length) m.hist[m.hist.length - 1] = Math.min(m.hist[m.hist.length - 1], v);
    else { m.hist.push(v); if (m.hist.length > 30) m.hist = m.hist.slice(-30); }
    m.day = todayStr();
    S.monitors[k] = m;
  }
};

/* =========================================================
   资料证书 · 证书签名、资质证照、开发者账号、合同发票
   文件存在这台电脑浏览器的 IndexedDB 里（不上传任何地方）
   私钥类文件可以用「资料柜密码」加密保存（AES-256-GCM，密钥由 PBKDF2 从密码派生，密码不保存）
   ========================================================= */
var FileStore = (function () {
  var dbp = null, mem = {}, okFlag = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise(function (res) {
      try {
        if (!window.indexedDB) { res(null); return; }
        var rq = indexedDB.open('dev-workbench-files', 1);
        rq.onupgradeneeded = function () { try { rq.result.createObjectStore('files'); } catch (e) { } };
        rq.onsuccess = function () { res(rq.result); };
        rq.onerror = function () { res(null); };
        rq.onblocked = function () { res(null); };
      } catch (e) { res(null); }
    });
    dbp.then(function (d) { okFlag = !!d; });
    return dbp;
  }
  function req(d, mode, fn) {
    return new Promise(function (res, rej) {
      var t;
      try { t = d.transaction('files', mode); } catch (e) { rej(e); return; }
      var r = fn(t.objectStore('files'));
      t.oncomplete = function () { res(r ? r.result : null); };
      t.onerror = function () { rej(t.error || new Error('写入失败')); };
      t.onabort = function () { rej(t.error || new Error('存储空间不足或被浏览器拒绝')); };
    });
  }
  return {
    init: open,
    ok: function () { return okFlag; },
    put: function (k, v) { return open().then(function (d) { if (!d) { mem[k] = v; return null; } return req(d, 'readwrite', function (st) { return st.put(v, k); }); }); },
    get: function (k) { return open().then(function (d) { if (!d) return mem[k] || null; return req(d, 'readonly', function (st) { return st.get(k); }); }); },
    del: function (k) { return open().then(function (d) { if (!d) { delete mem[k]; return null; } return req(d, 'readwrite', function (st) { return st.delete(k); }); }); },
    clear: function () { mem = {}; return open().then(function (d) { if (!d) return null; return req(d, 'readwrite', function (st) { return st.clear(); }); }); }
  };
})();
FileStore.init();

var Vault = { pw: null, cat: 'all', q: '', pid: '' };

function b64e(buf) { var b = new Uint8Array(buf), s = '', n = 0x8000; for (var i = 0; i < b.length; i += n) s += String.fromCharCode.apply(null, b.subarray(i, i + n)); return btoa(s); }
function b64d(str) { var s = atob(str), b = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; }
function deriveKey(pw, salt) {
  return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 150000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);

  return encBuf(pw, new TextEncoder().encode(VAULT_MARK)).then(function (o) {

  });

function checkPw(pw) {

/* ---------- 工具 ---------- */
function fmtSize(n) { n = +n || 0; return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : n >= 1024 ? Math.round(n / 1024) + ' KB' : n + ' B'; }
function extOf(name) { var m = String(name || '').match(/\.([a-z0-9]{1,10})$/i); return m ? m[1].toLowerCase() : ''; }
function guessCat(name) {
  var n = String(name || '').toLowerCase();
  if (/营业执照|著作权|软著|备案|icp|商标|资质|许可证/.test(n)) return 'license';
  if (/合同|协议|发票|验收|报价|invoice|contract/.test(n)) return 'contract';
  if (/\.(p12|pfx|cer|crt|pem|key|jks|keystore|p8|mobileprovision|provisionprofile|csr)$/.test(n) || /证书|签名|cert|provision|ssl/.test(n)) return 'cert';
  if (/账号|账户|account|开发者/.test(n)) return 'account';
  return 'other';
}
function vSort(a, b) {
  var da = dayDiff(a.expire), db = dayDiff(b.expire);
  if ((da === null) !== (db === null)) return da === null ? 1 : -1;
  if (da !== null && da !== db) return da - db;
  return (b.created || '') < (a.created || '') ? -1 : 1;
}
function dueShort(d) {
  if (d === null || d > 60) return '';
  return '<span class="vs-due-t ' + (d <= 7 ? 'red' : d <= 30 ? 'amber' : '') + '">' + (d < 0 ? '已过期' : d === 0 ? '今天' : d + '天') + '</span>';
}
function catDot(c, size) { size = size || 26; return '<span class="vcat-ic" style="width:' + size + 'px;height:' + size + 'px;background:' + VCATS[c].c + '1f;color:' + VCATS[c].c + '">' + (c === 'cert' ? ICON.key : c === 'license' ? ICON.cert : c === 'account' ? ICON.users : c === 'contract' ? ICON.doc : ICON.folder) + '</span>'; }
function canPreview(f) { return /^(image\/|application\/pdf|text\/)/.test(f.type || '') || /^(png|jpe?g|gif|webp|svg|pdf|txt|md)$/.test(extOf(f.name)); }

function mdInline(s) {
  return s.replace(/\x60([^\x60]+)\x60/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');

function mdToHtml(md) {
  var lines = esc(md || '').split('\n'), out = [], list = null, para = [], tbl = null;
  function flushP() { if (para.length) { out.push('<p>' + mdInline(para.join('<br>')) + '</p>'); para = []; } }
  function flushL() { if (list) { out.push('<' + list.t + '>' + list.items.map(function (x) { return '<li>' + mdInline(x) + '</li>'; }).join('') + '</' + list.t + '>'); list = null; } }
  function flushT() {
    if (!tbl) return;
    var rows = tbl.filter(function (r) { return !/^\s*\|?\s*:?-{2,}/.test(r); });
    out.push('<table>' + rows.map(function (r, i) { var cells = r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|'); return '<tr>' + cells.map(function (c) { return (i === 0 ? '<th>' : '<td>') + mdInline(c.trim()) + (i === 0 ? '</th>' : '</td>'); }).join('') + '</tr>'; }).join('') + '</table>');
    tbl = null;
  }
  lines.forEach(function (ln) {
    var m;
    if (/^\s*\|.*\|\s*$/.test(ln)) { flushP(); flushL(); (tbl = tbl || []).push(ln); return; } else flushT();
    if ((m = ln.match(/^(#{1,4})\s+(.*)$/))) { flushP(); flushL(); var lv = Math.min(3, m[1].length); out.push('<h' + lv + '>' + mdInline(m[2]) + '</h' + lv + '>'); return; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(ln)) { flushP(); flushL(); out.push('<hr>'); return; }
    if ((m = ln.match(/^\s*[-*•]\s+(.*)$/))) { flushP(); if (!list || list.t !== 'ul') { flushL(); list = { t: 'ul', items: [] }; } list.items.push(m[1]); return; }
    if ((m = ln.match(/^\s*\d+[.、)]\s+(.*)$/))) { flushP(); if (!list || list.t !== 'ol') { flushL(); list = { t: 'ol', items: [] }; } list.items.push(m[1]); return; }
    if ((m = ln.match(/^\s*&gt;\s?(.*)$/))) { flushP(); flushL(); out.push('<blockquote>' + mdInline(m[1]) + '</blockquote>'); return; }
    if (!ln.trim()) { flushP(); flushL(); return; }
    flushL(); para.push(ln);
  });
  flushP(); flushL(); flushT();
  return out.join('');
}

    h += '<div class="panel set-sec"><div class="panel-title">数据与备份</div><div class="panel-sub">所有数据只保存在这台电脑的浏览器里，不会上传。清理浏览器数据、换电脑前，请先导出备份。</div>' +
      '<div class="info-grid" style="margin-bottom:16px"><div class="k">当前数据</div><div>' + S.projects.length + ' 个项目 · ' + S.revenue.length + ' 条收入 · ' + S.costs.length + ' 项成本 · ' + S.tasks.length + ' 个任务 · ' + S.ideas.length + ' 个想法 · ' + S.vault.length + ' 项资料证书 · ' + S.chats.length + ' 个 AI 对话</div>' +
      '<div class="k">占用空间</div><div class="num">' + (size / 1024).toFixed(1) + ' KB</div>' +
      '<div class="k">上次备份</div><div>' + (st.lastBackup ? fmtTime(st.lastBackup) : '<span class="dn">还没有备份过</span>') + '</div>' +
      '<div class="k">存储状态</div><div>' + (Store.ok() ? '正常' : '<span class="dn">浏览器禁止了本地存储，关闭页面后数据会丢失，请及时导出备份</span>') + '</div>' +
      '<div class="k">资料文件</div><div>' + (FileStore.ok() === false ? '<span class="dn">浏览器不支持文件存储，资料文件只在本次打开期间有效</span>' : '存在浏览器的 IndexedDB 里；导出备份时会一起打包（加密文件保持加密）') + '</div></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-dark" data-act="backup">' + ICON.down + '导出备份</button><label class="btn btn-light" style="cursor:pointer">' + ICON.up + '从备份恢复<input type="file" accept=".json" hidden data-chg="restore"></label></div></div>' +
      '<div class="panel set-sec"><div class="panel-title">重新开始</div><div class="panel-sub">以下操作会覆盖当前数据，建议先导出备份</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-light" data-act="load-demo">载入示例工作室</button><button class="btn btn-light" data-act="wipe" style="color:var(--red)">' + ICON.trash + '清空全部数据</button></div></div>';
  } else if (SetP.sec === 'about') {
    h += '<div class="panel set-sec"><div style="display:flex;gap:14px;align-items:center">' + brandMark().replace('class="brand-mark"', 'class="brand-mark" style="width:52px;height:52px"') + '<div><div style="font-size:18px;font-weight:700">开发者工作台</div><div class="muted" style="font-size:13px">个人工作台系列 · 第 2 期 · v' + VERSION + '</div></div></div>' +
      '<div style="font-size:13.5px;line-height:1.9;color:var(--ink2);margin-top:14px">一个打开就能用的单文件工作台：把你所有的项目放进一间机房，每个项目一台机柜，开发中、运营中一眼看清；每个项目的收入、成本、利润自动汇总；多端项目是服务器、PC 端是电脑、手机端是手机；前端、后端、数据库一键跳转；开发者证书、资质证照、合同统一收纳；还有迭代看板、到期提醒、服务检测、灵感打分，外加可接入任意大模型的开发助理。所有数据都留在你自己的电脑上。<br>开源版只做 PC 端；手机端和更多职业版本会陆续推出。</div>' +
      '<div style="font-size:13px;line-height:1.8;color:var(--ink2);margin-top:12px;padding:12px 14px;background:var(--fill);border-radius:12px"><b style="color:var(--ink)">使用许可</b><br>个人使用免费：可以使用、修改、二次开发，也可以免费分享给别人，请保留作者署名、水印和许可文件。<br>商业使用需要授权：出售、打包进付费产品或课程、对外提供付费服务、公司或团队内部部署、给客户定制收费等，都需要先取得作者书面授权。完整条款见随软件附带的 LICENSE 文件。</div>' +
      '<div style="font-size:13px;line-height:1.9;color:var(--ink2);margin-top:12px"><b style="color:var(--ink)">快捷键</b><br><span class="kbd">' + (IS_MAC ? '⌘' : 'Ctrl ') + 'K</span> 搜索项目 / 跳转入口　<span class="kbd">Esc</span> 关闭弹窗　<span class="kbd">' + (IS_MAC ? '⌘' : 'Ctrl ') + '滚轮</span> 缩放机房　把文件拖进窗口任意位置 → 收进资料证书</div>' +
      '<div class="sign" style="padding:14px 0 0;font-size:11px">' + WATERMARK + '</div></div>';
  }
  el.innerHTML = h;
}
UI.act['set-gender'] = function (el) { S.settings.dev.gender = el.getAttribute('data-g'); save(); UI.refreshSide(); renderSetBody(); };
UI.act['set-cur'] = function (el) { S.settings.currency = el.getAttribute('data-c'); save(); renderSetBody(); };
UI.chg['set-anim'] = function (el) { S.settings.anim = el.checked; save(); };
UI.act['set-rows'] = function (el) { S.settings.rows = +el.getAttribute('data-n'); fixSeats(); save(); renderSetBody(); };
UI.act['set-cols'] = function (el) { S.settings.cols = +el.getAttribute('data-n'); fixSeats(); save(); renderSetBody(); };
function fixSeats() {
  S.projects.forEach(function (p) { if (!p.seat) return; var q = p.seat.split('-'); if (+q[0] >= S.settings.rows || +q[1] >= S.settings.cols) p.seat = null; });
  S.projects.forEach(function (p) { if (!p.seat && p.status !== 'archived') p.seat = freeSeat(); });
  Std.view.fit = true;
}
UI.chg['ai-provider'] = function (el) { var p = presetOf(el.value), a = S.settings.ai; a.provider = p.id; if (p.id !== 'custom') { a.base = p.base; a.model = p.model; } save(); renderSetBody(); };
UI.act['ai-key-eye'] = function () { var k = $('#aiKey'); k.type = k.type === 'password' ? 'text' : 'password'; };
UI.act['ai-test'] = function () {
  var r = $('#aiTestRes');
  if (!AIC.ready()) { r.innerHTML = '<span class="dn">请先填写接口地址、模型名称和 API Key</span>'; return; }
  r.textContent = '正在连接…';
  var t0 = Date.now();
  AIC.stream([{ role: 'user', content: '请只回复四个字：连接成功' }], function () { }, null, 20).then(function (txt) {
    r.innerHTML = '<span class="up">' + ICON.check.replace('<svg', '<svg style="display:inline;vertical-align:-3px"') + ' 连接成功（' + ((Date.now() - t0) / 1000).toFixed(1) + ' 秒）</span> <span class="muted">模型回复：' + esc(String(txt).slice(0, 30)) + '</span>';
  }).catch(function (e) { r.innerHTML = '<span class="dn" style="white-space:pre-line">' + esc(e.message) + '</span>'; });
};
UI.act['backup'] = function () {
  S.settings.lastBackup = Date.now(); save(true);
  var d = new Date();
  vaultDump().then(function (files) {
    var dump = JSON.parse(JSON.stringify(S)), n = Object.keys(files).length;
    dump.vaultFiles = files; dump._developedBy = WATERMARK;
    downloadFile('开发者工作台备份-' + S.settings.studio + '-' + todayStr() + '-' + pad2(d.getHours()) + pad2(d.getMinutes()) + '.json', JSON.stringify(dump), 'application/json');
    UI.toast('备份已下载' + (n ? '（含 ' + n + ' 个资料文件）' : '') + '，请妥善保存');
    if (UI.page === 'settings') renderSetBody();
  }).catch(function () { UI.toast('打包资料文件失败，请重试'); });
};
UI.chg['restore'] = function (el) {
  var f = el.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    try {
      var d = JSON.parse(rd.result);
      if (!d || !d.settings || !Array.isArray(d.projects)) throw new Error('bad');
      UI.confirm('从备份恢复', '备份里有 ' + d.projects.length + ' 个项目、' + (d.revenue || []).length + ' 条收入记录。恢复会覆盖当前全部数据，确定吗？', '恢复', function () {
        var files = d.vaultFiles || {}; delete d.vaultFiles;
        S = migrate(d); S.settings.onboarded = true; save(true);
        vaultLoad(files).then(function () { Std.entered = false; Std.view.fit = true; UI.shell(); UI.go('studio'); UI.toast('已恢复' + (Object.keys(files).length ? '，含 ' + Object.keys(files).length + ' 个资料文件' : '')); }).catch(function () { UI.shell(); UI.go('studio'); UI.toast('数据已恢复，但资料文件写入失败（可能是存储空间不足）'); });
      });
    } catch (e) { UI.toast('这不是有效的开发者工作台备份文件'); }
  };
  rd.readAsText(f, 'utf-8');
  el.value = '';
};
UI.act['load-demo'] = function () {
  UI.confirm('载入示例工作室', '会用 8 个示例项目和 12 个月的收支数据覆盖当前数据（保留你的形象和 AI 设置）。', '载入', function () {
    var keep = { dev: S.settings.dev, ai: S.settings.ai, ob: S.settings.onboarded };
    S = demoState(); S.settings.dev = keep.dev; S.settings.ai = keep.ai; S.settings.onboarded = true; Vault.pw = null;
    save(true); Std.entered = false; Std.view.fit = true; UI.shell(); UI.go('studio');
    FileStore.clear().then(seedDemoFiles);
  }, true);
};
UI.act['wipe'] = function () {
  UI.confirm('清空全部数据', '项目、收支、任务、灵感、资料证书（含文件）、AI 对话都会被删除，无法恢复。确定吗？', '清空', function () {
    var keep = { dev: S.settings.dev, ai: S.settings.ai, studio: S.settings.studio };
    S = defaultState(); S.settings.dev = keep.dev; S.settings.ai = keep.ai; S.settings.studio = keep.studio; S.settings.onboarded = true; Vault.pw = null;
    FileStore.clear();
    save(true); UI.shell(); UI.go('studio'); UI.toast('已清空');
  }, true);
};

/* ---------- 导出文件也带上开发者水印（覆盖通用版的导出函数） ---------- */
function toCSV(rows) { return '\ufeff' + rows.concat([[], [WATERMARK]]).map(function (r) { return r.map(csvCell).join(','); }).join('\r\n'); }
function exportWord(title, md) {
  var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><meta name="author" content="@赛博老爸"><title>' + esc(title) + '</title>' +
    '<style>body{font-family:"宋体",SimSun,"Songti SC",serif;font-size:12pt;line-height:1.8}h1{font-size:18pt;text-align:center}h2{font-size:15pt}h3{font-size:13pt}table{border-collapse:collapse;margin:6pt 0}td,th{border:1px solid #999;padding:4pt 8pt}blockquote{color:#555;border-left:3px solid #ccc;padding-left:8pt}.wm{margin-top:24pt;text-align:right;color:#b5b5b2;font-size:8pt;font-family:Arial,sans-serif}</style></head><body><h1>' + esc(title) + '</h1>' + mdToHtml(md) + '<p class="wm">' + WATERMARK + '</p></body></html>';
  downloadFile(String(title).replace(/[\\\/:*?"<>|]/g, '_') + '.doc', '\ufeff' + html, 'application/msword');
}

/* =========================================================
   启动 · 首次欢迎页（选择形象）→ 进入工作室
   ========================================================= */
var Welcome = { g: 'M', mode: 'demo' };
function showWelcome() {
  var el = document.createElement('div'); el.className = 'welcome'; el.id = 'welcome';
  el.innerHTML = '<div class="welcome-in">' +
    '<div style="display:flex;justify-content:center;margin-bottom:18px">' + brandMark().replace('class="brand-mark"', 'class="brand-mark" style="width:48px;height:48px"') + '</div>' +
    '<h1>你好，我是你的开发者工作台</h1><p class="lead">先选一个头像，再给你的机房起个名字</p>' +
    '<div class="w-avatars">' + ['M', 'F'].map(function (g) { return '<button class="' + (Welcome.g === g ? 'on' : '') + '" data-act="w-g" data-g="' + g + '"><span class="circle">' + ART.teacherAvatar({ gender: g }, 96, false) + '</span>' + (g === 'F' ? '女生' : '男生') + '</button>'; }).join('') + '</div>' +
    '<div class="w-form"><div class="field"><label>怎么称呼你</label><input class="inp" id="wName" placeholder="如：小林" value=""></div><div class="field"><label>工作室名称</label><input class="inp" id="wStudio" placeholder="如：个人开发者工作室"></div></div>' +
    '<div class="w-mode"><button class="' + (Welcome.mode === 'demo' ? 'on' : '') + '" data-act="w-mode" data-m="demo"><b>先看看示例工作室</b>8 个示例项目、12 个月收支和一组资料证书，随时可以清空</button><button class="' + (Welcome.mode === 'blank' ? 'on' : '') + '" data-act="w-mode" data-m="blank"><b>直接管理我的项目</b>空机房，点空机位新建项目</button></div>' +
    '<button class="btn btn-dark w-go" data-act="w-go">开启工作台</button>' +
    '<div class="muted" style="font-size:12px;margin-top:16px">' + ICON.lock.replace('width="14" height="14"', 'width="12" height="12" style="display:inline;vertical-align:-1px"') + ' 所有数据只保存在这台电脑的浏览器里</div><div class="sign" style="padding-top:28px">' + WATERMARK + '</div></div>';
  document.body.appendChild(el);
}
UI.act['w-g'] = function (el) { Welcome.g = el.getAttribute('data-g'); $$('.w-avatars button').forEach(function (b) { b.classList.toggle('on', b === el); }); };
UI.act['w-mode'] = function (el) { Welcome.mode = el.getAttribute('data-m'); $$('.w-mode button').forEach(function (b) { b.classList.toggle('on', b === el); }); };
UI.act['w-go'] = function () {
  var name = fval('wName') || '开发者', studio = fval('wStudio');
  S = Welcome.mode === 'demo' ? demoState() : defaultState();
  S.settings.dev = { name: name, gender: Welcome.g, role: '独立开发者' };
  if (studio) S.settings.studio = studio;
  S.settings.onboarded = true;
  save(true);
  if (Welcome.mode === 'demo') FileStore.clear().then(seedDemoFiles);
  var w = $('#welcome'); w.style.transition = 'opacity .3s'; w.style.opacity = '0'; setTimeout(function () { w.remove(); }, 300);
  UI.shell(); UI.go('studio');
};

/* 对外暴露：方便后续版本（商用版 / 手机端）扩展 */
window.DevWorkbench = { version: VERSION, data: function () { return S; }, ai: AIC, context: { work: workContext, project: projContext, finance: financeContext } };

function boot() {
  try { console.log('%c开发者工作台 v' + VERSION + ' · ' + WATERMARK, 'color:#9a9a97;font-size:11px'); } catch (e) { }
  S = load();
  if (!S || !S.settings.onboarded) { S = defaultState(); showWelcome(); return; }
  UI.shell();
  var h = (location.hash || '').replace('#/', '');
  UI.go(UI.pages[h] ? h : 'studio');
  if (!Store.ok()) setTimeout(function () { UI.toast('浏览器禁止了本地存储，关闭页面前请到设置里导出备份'); }, 800);
}
window.addEventListener('hashchange', function () {
  var h = (location.hash || '').replace('#/', '');
  if (S && S.settings.onboarded && UI.pages[h] && h !== UI.page) UI.go(h);
});
boot();
</script>
